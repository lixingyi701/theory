[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-theory"
version = "0.1.0"
description = "Instrumented agent execution and replay audits for residual-error research"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-rel = "agent_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
